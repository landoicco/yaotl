name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Same tool versions as local, pinned by flake.lock
      - name: luacheck
        run: nix develop --command luacheck .
      - name: StyLua
        run: nix develop --command stylua --check .
